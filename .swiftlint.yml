included:
  - Sources
  - Tests

excluded:
  - .build
  - deps

opt_in_rules:
  - empty_string
  - closure_spacing
  - contains_over_first_not_nil
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - sorted_imports
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - trailing_comma

identifier_name:
  min_length:
    warning: 1
    error: 1
  excluded:
    - id
    - db
    - fm
    - h
    - i
    - j
    - n
    - x
    - y

line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500
