name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Swift ${{ matrix.swift }} / GRDB ${{ matrix.grdb }}
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        swift: ["5.9", "5.10", "6.0"]
        grdb: ["7.5.0", "7.8.0", "7.10.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pin GRDB version
        run: |
          RESOLVED=Package.resolved
          GRDB_VERSION="${{ matrix.grdb }}"
          if [ -f "$RESOLVED" ]; then
            python3 - <<EOF
          import json, sys
          with open("$RESOLVED") as f:
              data = json.load(f)
          for pin in data.get("pins", []):
              if "groue/GRDB.swift" in pin.get("location", "") or pin.get("identity", "").lower() == "grdb.swift":
                  pin["state"]["version"] = "$GRDB_VERSION"
                  pin["state"].pop("branch", None)
                  pin["state"].pop("revision", None)
          with open("$RESOLVED", "w") as f:
              json.dump(data, f, indent=2)
          EOF
          fi

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -c release

      - name: Run tests
        run: swift test --parallel
